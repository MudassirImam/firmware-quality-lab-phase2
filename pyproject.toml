[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-quality-lab"
version = "0.1.0"
description = "Deterministic firmware emulation and DSP quality engineering lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]
dsp = ["numpy>=1.26", "scipy>=1.11"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
  "unit: component-level tests",
  "contract: public interface contract tests",
  "integration: cross-component workflow tests",
  "system: end-to-end emulator scenarios",
]

[tool.setuptools.packages.find]
include = ["emulator*", "dsp*", "observability*", "contracts*"]
